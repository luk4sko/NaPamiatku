<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NaPamiatku — Prihlásenie</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page narrow">
    <div class="top-bar">
      <h1>Prihlásenie</h1>
      <div class="top-bar-actions">
        <button class="secondary small" data-theme-toggle>🌙</button>
      </div>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Heslo</label>
        <div class="password-field">
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
      </div>
      <button type="submit" id="submitButton">Prihlásiť sa</button>
      <p id="message" class="message"></p>
    </form>

    <div class="card">
      <h3>Zabudnuté heslo</h3>
      <p class="muted">Pošleme ti na email odkaz, cez ktorý si nastavíš nové heslo.</p>
      <button type="button" class="secondary" id="resetButton">Poslať odkaz na obnovu</button>
      <p id="resetMessage" class="message"></p>
    </div>

    <p class="muted"><a href="index.html">← Späť na úvod</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Ak už je používateľ prihlásený, nemá čo robiť na prihlasovacej stránke.
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.href = "dashboard.html";
    })();

    const messageEl = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage(messageEl, "");
      submitButton.disabled = true;

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      });

      submitButton.disabled = false;

      if (error) {
        showMessage(messageEl, "Nesprávny email alebo heslo.", "error");
        return;
      }
      window.location.href = "dashboard.html";
    });

    document.getElementById("resetButton").addEventListener("click", async () => {
      const resetMessageEl = document.getElementById("resetMessage");
      const email = document.getElementById("email").value.trim();

      if (!email) {
        showMessage(resetMessageEl, "Najprv vyplň email vyššie.", "error");
        return;
      }

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname.replace("login.html", "set-password.html"),
      });

      if (error) {
        showMessage(resetMessageEl, error.message, "error");
        return;
      }
      showMessage(resetMessageEl, "Ak účet existuje, poslali sme naň email s odkazom.", "ok");
    });
  </script>
</body>
</html>
