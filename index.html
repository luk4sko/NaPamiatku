<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NaPamiatku</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main>
    <h1>NaPamiatku</h1>
    <p>Test pripojenia k Supabase:</p>
    <p id="status">Overujem...</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    async function testConnection() {
      const statusEl = document.getElementById("status");
      const { error } = await supabaseClient.from("events").select("id", { count: "exact", head: true });

      if (error) {
        statusEl.textContent = "Nepripojené: " + error.message;
        statusEl.className = "error";
      } else {
        statusEl.textContent = "Pripojené k Supabase";
        statusEl.className = "ok";
      }
    }

    testConnection();
  </script>
</body>
</html>
