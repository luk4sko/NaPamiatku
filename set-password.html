<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NaPamiatku — Nastavenie hesla</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth">
    <aside class="auth-visual">
      <img src="img/auth-heslo-lg.webp" alt="" />
      <div class="auth-visual-body">
        <a class="logo" href="index.html">Na<span>Pamiatku</span></a>
        <p class="auth-quote">
          Ešte jeden krok.
          <span>Zvoľ si heslo, ktoré budeš používať na prihlásenie do svojho účtu.</span>
        </p>
      </div>
    </aside>

    <main class="auth-form">
      <div class="auth-form-inner">
        <div class="auth-head">
          <a class="logo" href="index.html">Na<span>Pamiatku</span></a>
          <button class="secondary small" data-theme-toggle>🌙</button>
        </div>

        <h1>Nastavenie hesla</h1>

        <div id="loading"><p class="muted">Overujem odkaz...</p></div>

        <div id="invalid" class="hidden">
          <p class="message error">Odkaz je neplatný alebo mu vypršala platnosť.</p>
          <p class="muted">Skús si nechať poslať nový odkaz na prihlasovacej stránke.</p>
          <a href="login.html"><button type="button" class="secondary">Späť na prihlásenie</button></a>
        </div>

        <form id="passwordForm" class="hidden">
          <p class="muted" id="emailInfo"></p>
          <div class="field">
            <label for="fullName">Tvoje meno</label>
            <input type="text" id="fullName" autocomplete="name" />
          </div>
          <div class="field">
            <label for="password">Nové heslo (aspoň 8 znakov)</label>
            <div class="password-field">
              <input type="password" id="password" autocomplete="new-password" minlength="8" required />
            </div>
          </div>
          <div class="field">
            <label for="passwordAgain">Heslo znova</label>
            <div class="password-field">
              <input type="password" id="passwordAgain" autocomplete="new-password" minlength="8" required />
            </div>
          </div>
          <button type="submit" id="submitButton">Uložiť heslo</button>
          <p id="message" class="message"></p>
        </form>

        <div class="auth-foot">
          <p><a href="index.html">← Späť na úvod</a></p>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/app.js"></script>
  <script>
    const messageEl = document.getElementById("message");

    // Supabase po kliknutí na odkaz z emailu automaticky vytvorí session.
    // Preto tu nekontrolujeme žiadny token ručne - stačí sa spýtať na session.
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      document.getElementById("loading").classList.add("hidden");

      if (!session) {
        document.getElementById("invalid").classList.remove("hidden");
        return;
      }

      document.getElementById("emailInfo").textContent = "Účet: " + session.user.email;
      document.getElementById("passwordForm").classList.remove("hidden");

      const profile = await loadProfile(session.user.id);
      if (profile && profile.full_name) {
        document.getElementById("fullName").value = profile.full_name;
      }
    })();

    document.getElementById("passwordForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const submitButton = document.getElementById("submitButton");
      const password = document.getElementById("password").value;
      const passwordAgain = document.getElementById("passwordAgain").value;

      if (password !== passwordAgain) {
        showMessage(messageEl, "Heslá sa nezhodujú.", "error");
        return;
      }

      submitButton.disabled = true;
      const { data: { session } } = await supabaseClient.auth.getSession();

      const { error } = await supabaseClient.auth.updateUser({ password: password });
      if (error) {
        submitButton.disabled = false;
        showMessage(messageEl, error.message, "error");
        return;
      }

      const fullName = document.getElementById("fullName").value.trim();
      if (fullName) {
        await supabaseClient.from("profiles").update({ full_name: fullName }).eq("id", session.user.id);
      }

      showMessage(messageEl, "Heslo uložené. Presmerovávam...", "ok");
      setTimeout(() => { window.location.href = "dashboard.html"; }, 1200);
    });
  </script>
</body>
</html>
