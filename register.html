<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NaPamiatku — Registrácia</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main>
    <h1>Registrácia</h1>
    <form id="registerForm">
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div>
        <label for="password">Heslo</label>
        <input type="password" id="password" minlength="6" required />
      </div>
      <div>
        <label for="passwordConfirm">Heslo znova</label>
        <input type="password" id="passwordConfirm" minlength="6" required />
      </div>
      <button type="submit">Zaregistrovať sa</button>
      <p id="message"></p>
    </form>
    <p class="switch-link">Už máš účet? <a href="login.html">Prihlás sa</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script>
    const form = document.getElementById("registerForm");
    const messageEl = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      messageEl.textContent = "";
      messageEl.className = "";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const passwordConfirm = document.getElementById("passwordConfirm").value;

      if (password !== passwordConfirm) {
        messageEl.textContent = "Heslá sa nezhodujú.";
        messageEl.className = "error";
        return;
      }

      const submitButton = form.querySelector("button");
      submitButton.disabled = true;

      const { data, error } = await supabaseClient.auth.signUp({ email, password });

      submitButton.disabled = false;

      if (error) {
        messageEl.textContent = error.message;
        messageEl.className = "error";
        return;
      }

      if (data.session) {
        // Potvrdzovanie emailu je vypnuté -> používateľ je hneď prihlásený
        window.location.href = "dashboard.html";
      } else {
        messageEl.textContent = "Účet vytvorený. Skontroluj email a potvrď registráciu, potom sa prihlás.";
        messageEl.className = "ok";
      }
    });
  </script>
</body>
</html>
