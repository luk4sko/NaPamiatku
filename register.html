<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NaPamiatku — Registrácia</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page narrow">
    <div class="top-bar">
      <h1>Registrácia</h1>
      <div class="top-bar-actions">
        <button class="secondary small" data-theme-toggle>🌙</button>
      </div>
    </div>

    <p class="muted">
      Vytvor si účet a potom nám cez dashboard pošli žiadosť o event —
      po schválení dostaneš QR kód pre svojich hostí.
    </p>

    <form id="registerForm">
      <div class="field">
        <label for="fullName">Tvoje meno</label>
        <input type="text" id="fullName" autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />
      </div>
      <button type="submit" id="submitButton">Zaregistrovať sa</button>
      <p id="message" class="message"></p>
    </form>

    <p class="muted">Už máš účet? <a href="login.html">Prihlás sa</a></p>
    <p class="muted"><a href="index.html">← Späť na úvod</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Ak už je používateľ prihlásený, nemá čo robiť na registračnej stránke.
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.href = "dashboard.html";
    })();

    const messageEl = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    document.getElementById("registerForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage(messageEl, "");
      submitButton.disabled = true;

      const email = document.getElementById("email").value.trim();
      const fullName = document.getElementById("fullName").value.trim();

      // Rovnaký mechanizmus ako pozvánka od Majiteľa v dashboard.html:
      // heslo sa netypuje priamo do formulára, ale nastaví sa až po kliknutí
      // na odkaz z emailu (set-password.html). Nový profil dostane rolu
      // "klient" automaticky - pozri trigger handle_new_user v DB.
      const { error } = await supabaseClient.auth.signInWithOtp({
        email: email,
        options: {
          shouldCreateUser: true,
          data: fullName ? { full_name: fullName } : undefined,
          emailRedirectTo: window.location.origin +
            window.location.pathname.replace("register.html", "set-password.html"),
        },
      });

      submitButton.disabled = false;

      if (error) {
        showMessage(messageEl, error.message, "error");
        return;
      }
      document.getElementById("registerForm").reset();
      showMessage(messageEl, "Poslali sme ti na email odkaz, cez ktorý si dokončíš registráciu a nastavíš heslo.", "ok");
    });
  </script>
</body>
</html>
