<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NaPamiatku — Registrácia</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth">
    <aside class="auth-visual">
      <img src="img/auth-registracia-lg.webp" alt="" />
      <div class="auth-visual-body">
        <a class="logo" href="index.html">Na<span>Pamiatku</span></a>
        <p class="auth-quote">
          Za pár minút máte QR kód na stoloch.
          <span>Vytvorte si účet, požiadajte o event a po schválení je všetko pripravené.</span>
        </p>
      </div>
    </aside>

    <main class="auth-form">
      <div class="auth-form-inner">
        <div class="auth-head">
          <a class="logo" href="index.html">Na<span>Pamiatku</span></a>
          <button class="secondary small" data-theme-toggle>🌙</button>
        </div>

        <h1>Registrácia</h1>
        <p class="auth-intro">
          Vytvor si účet a potom rovno v dashboarde požiadaj o event —
          po schválení dostaneš QR kód pre svojich hostí.
        </p>

        <form id="registerForm">
          <div class="field">
            <label for="fullName">Tvoje meno</label>
            <input type="text" id="fullName" autocomplete="name" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Heslo (aspoň 6 znakov)</label>
            <div class="password-field">
              <input type="password" id="password" autocomplete="new-password" minlength="6" required />
            </div>
          </div>
          <div class="field">
            <label for="passwordConfirm">Heslo znova</label>
            <div class="password-field">
              <input type="password" id="passwordConfirm" autocomplete="new-password" minlength="6" required />
            </div>
          </div>
          <button type="submit" id="submitButton">Zaregistrovať sa</button>
          <p id="message" class="message"></p>
        </form>

        <div class="auth-foot">
          <p>Už máš účet? <a href="login.html">Prihlás sa</a></p>
          <p><a href="index.html">← Späť na úvod</a></p>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Ak už je používateľ prihlásený, nemá čo robiť na registračnej stránke.
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.href = "dashboard.html";
    })();

    const messageEl = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    document.getElementById("registerForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage(messageEl, "");

      const email = document.getElementById("email").value.trim();
      const fullName = document.getElementById("fullName").value.trim();
      const password = document.getElementById("password").value;
      const passwordConfirm = document.getElementById("passwordConfirm").value;

      if (password !== passwordConfirm) {
        showMessage(messageEl, "Heslá sa nezhodujú.", "error");
        return;
      }

      submitButton.disabled = true;

      // Klient zadá heslo rovno pri registrácii. Nový profil dostane rolu
      // "klient" automaticky - pozri trigger handle_new_user v DB - ale bez
      // schváleného eventu nemá k ničomu prístup, takže tu sa nič neschvaľuje.
      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: fullName ? { full_name: fullName } : undefined,
        },
      });

      submitButton.disabled = false;

      if (error) {
        showMessage(messageEl, error.message, "error");
        return;
      }

      // Ak email už existuje, Supabase to schválne nevráti ako chybu (aby sa
      // cez registráciu nedalo zisťovať, ktoré emaily sú u nás zaregistrované) -
      // pozná sa to podľa prázdneho poľa identities.
      if (data.user && data.user.identities && data.user.identities.length === 0) {
        showMessage(messageEl, "Tento email je už zaregistrovaný. Prihlás sa.", "error");
        return;
      }

      document.getElementById("registerForm").reset();

      if (data.session) {
        window.location.href = "dashboard.html";
        return;
      }

      showMessage(messageEl, "Účet vytvorený. Skontroluj email a potvrď registráciu, potom sa môžeš prihlásiť.", "ok");
    });
  </script>
</body>
</html>
