<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NaPamiatku — Stránka nenájdená</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="site-nav">
    <div class="site-nav-inner">
      <a class="logo" href="/">Na<span>Pamiatku</span></a>
      <button class="secondary small icon-button" data-theme-toggle aria-label="Prepnúť svetlý a tmavý režim"></button>
    </div>
  </nav>

  <main class="not-found">
    <div class="not-found-inner">
      <p class="not-found-code">404</p>
      <div class="empty-state-icon"><span data-icon="search"></span></div>
      <h1>Túto stránku sme nenašli</h1>
      <p class="muted">Adresa, ktorú hľadáš, tu nie je. Možno bola preklep, alebo odkaz už neplatí. Ak si sem prišiel cez QR kód, opýtaj sa organizátora na nový.</p>
      <div class="button-row">
        <a class="button" href="/"><span data-icon="arrowLeft"></span>Späť na úvod</a>
        <a class="button" href="/dashboard"><span data-icon="grid"></span>Moje eventy</a>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
